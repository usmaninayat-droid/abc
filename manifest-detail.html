<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifest Profile</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0e2547; --blue: #2f6bff; --ink: #1f2733; --muted: #8b94a6;
      --label: #9aa3b2; --line: #eef0f4; --green: #16a34a; --green-soft: #e3f7ec;
      --red: #e23b34; --red-soft: #fde4e2; --amber: #d98a00; --amber-soft: #fdf0d9;
      --card-shadow: 0 1px 2px rgba(16,40,80,0.05);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #dfe4ec; }
    button { font-family: inherit; }
    #app { display: flex; height: 100vh; width: 100vw; position: relative; }

    /* ---------- Navy icon rail ---------- */
    .rail { width: 56px; flex-shrink: 0; background: var(--navy); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; z-index: 30; }
    .rail .logo { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 200deg, #2f6bff, #7aa2ff, #2f6bff); margin-bottom: 14px; flex-shrink: 0; }
    .rail .nav-ico { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #93a4c4; cursor: pointer; font-size: 18px; }
    .rail .nav-ico.active { background: #fff; color: var(--navy); }
    .rail .spacer { flex: 1; }

    /* ---------- Manifests list page ---------- */
    .list-page { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #f7f8fb; transition: opacity .2s, filter .2s; }
    .list-page.dimmed { opacity: .5; filter: grayscale(.15); pointer-events: none; }
    .lp-head { padding: 18px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); background: #fff; }
    .lp-head h2 { margin: 0; font-size: 20px; }
    .lp-head .pill { font-size: 11px; color: var(--muted); background: #eef1f6; padding: 4px 10px; border-radius: 999px; }
    .lp-body { flex: 1; overflow: auto; padding: 20px 28px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 18px; }
    .search { flex: 1; display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 16px; color: var(--muted); font-size: 13.5px; }
    .icon-btn { width: 46px; border: 1px solid var(--line); border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }

    .mtable { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .mtable th { text-align: left; font-size: 10.5px; letter-spacing: .06em; color: var(--label); font-weight: 600; padding: 16px 14px; white-space: nowrap; background: #fbfcfe; }
    .mtable td { padding: 16px 14px; border-top: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
    .mtable tbody tr { cursor: pointer; }
    .mtable tbody tr:hover { background: #f7f9ff; }
    .mtable .ell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .03em; }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.red   { background: var(--red-soft); color: var(--red); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.blue  { background: #e4ecff; color: var(--blue); }
    .badge.grey  { background: #eef1f6; color: #6b7688; }
    .badge .dotc { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ---------- Profile overlay ---------- */
    .backdrop { position: absolute; inset: 0 0 0 56px; background: rgba(20,35,65,.18); z-index: 18; display: none; }
    .backdrop.show { display: block; }
    .panel { position: absolute; top: 0; right: 0; bottom: 0; left: 250px; background: #fff; border-radius: 16px 0 0 16px; box-shadow: -22px 0 60px rgba(20,40,80,.22); display: none; flex-direction: column; overflow: hidden; z-index: 20; }
    .panel.show { display: flex; }
    .panel-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    .dots { display: flex; gap: 7px; margin-right: 6px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; cursor: pointer; }
    .dots .r { background: #ff5f57; } .dots .y { background: #febc2e; }
    .asset-tab { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 9px; font-size: 12px; color: var(--muted); background: #eef1f6; cursor: pointer; white-space: nowrap; }
    .asset-tab.active { background: #e4ecff; color: var(--blue); }
    .asset-tab .tlabel { font-size: 9px; letter-spacing: .08em; opacity: .7; display: block; }
    .asset-tab b { font-size: 12.5px; color: inherit; }

    .panel-body { flex: 1; display: flex; min-height: 0; }

    /* ----- Left manifest hero column ----- */
    .hero-col { width: 304px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; }
    .hero-photo { background: #eef3fb; border-radius: 14px; height: 150px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; position: relative; }
    .hero-photo .badge { position: absolute; top: 12px; left: 12px; }
    .hero-photo svg { width: 64%; height: auto; }
    .hero-col h1 { font-size: 22px; margin: 6px 0 2px; font-weight: 700; }
    .hero-col .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .tags { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .tag { padding: 9px 16px; border-radius: 9px; font-size: 12px; font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag.g { background: var(--green-soft); color: var(--green); }
    .tag.a { background: var(--amber-soft); color: var(--amber); }
    .tag.add { background: #f1f3f7; color: var(--muted); }
    .section-label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0 8px; }
    .vd-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .vd-row:last-child { border-bottom: none; }
    .vd-row .k { color: var(--label); flex-shrink: 0; }
    .vd-row .v { font-weight: 600; text-align: right; word-break: break-word; }

    /* ----- Right content column ----- */
    .content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tabs-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 26px 0; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 28px; }
    .tab { padding-bottom: 14px; font-size: 14px; color: var(--muted); cursor: pointer; position: relative; }
    .tab.active { color: var(--blue); font-weight: 600; }
    .tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--blue); }
    .tabs-actions { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
    .edit-link { color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn { padding: 8px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }

    .scroll { flex: 1; overflow-y: auto; padding: 22px 26px; }
    .pane { display: none; } .pane.active { display: block; }

    /* section cards */
    .detail-cols { display: flex; gap: 20px; align-items: flex-start; }
    .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .col-l { flex: 1.5; } .col-r { flex: 1; }
    .card-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; box-shadow: var(--card-shadow); }
    .card-box h3 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
    .kv { display: flex; justify-content: space-between; gap: 18px; padding: 14px 0; border-bottom: 1px solid #f1f3f7; font-size: 14px; }
    .kv:last-child { border-bottom: none; }
    .kv .k { color: var(--label); flex-shrink: 0; font-weight: 400; }
    .kv .v { font-weight: 600; text-align: right; word-break: break-word; }

    /* lifecycle stepper */
    .stepper { display: flex; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
    .step { flex: 1; position: relative; text-align: center; }
    .step .dot { width: 30px; height: 30px; border-radius: 50%; background: #e7eaf0; color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 14px; position: relative; z-index: 2; }
    .step.done .dot { background: var(--green); }
    .step.current .dot { background: var(--blue); box-shadow: 0 0 0 5px rgba(47,107,255,.15); }
    .step .stitle { font-size: 13px; font-weight: 600; }
    .step .sdate { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .step::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 3px; background: #e7eaf0; z-index: 1; }
    .step:first-child::before { display: none; }
    .step.done::before, .step.current::before { background: var(--green); }

    /* vertical activity timeline */
    .vtimeline { position: relative; margin-top: 4px; }
    .vevent { position: relative; padding: 0 0 24px 26px; border-left: 2px solid var(--line); }
    .vevent:last-child { border-left-color: transparent; padding-bottom: 0; }
    .vevent .vdot { position: absolute; left: -9px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #e7eaf0; border: 3px solid #fff; }
    .vevent.done .vdot { background: var(--green); }
    .vevent.current .vdot { background: var(--blue); box-shadow: 0 0 0 4px rgba(47,107,255,.15); }
    .vevent .vt { font-size: 14px; font-weight: 600; }
    .vevent .vd { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .vevent .vmeta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

    /* documents */
    .doc-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #f1f3f7; }
    .doc-row:last-child { border-bottom: none; }
    .doc-ic { width: 38px; height: 38px; border-radius: 9px; background: #eef3ff; color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .doc-row .dn { font-weight: 600; font-size: 13.5px; }
    .doc-row .dm { font-size: 12px; color: var(--muted); }
    .doc-dl { margin-left: auto; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; }

    #map { height: 360px; border-radius: 12px; }
    .map-legend { display: flex; gap: 20px; margin-top: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
    .map-legend .lg { display: flex; align-items: center; gap: 7px; }
    .map-legend .pin { width: 12px; height: 12px; border-radius: 50%; }
    .pin.start { background: #2f6bff; } .pin.end { background: #16a34a; }

    /* status summary chips on list */
    .summary { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
    .schip { display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 12px; }
    .schip .sc-dot { width: 9px; height: 9px; border-radius: 50%; }
    .schip b { font-size: 13px; }
    .sc-grey { background: #aab3c2; } .sc-amber { background: var(--amber); } .sc-blue { background: var(--blue); } .sc-green { background: var(--green); }
    tr.removed td { opacity: .5; }
    tr.removed td b { text-decoration: line-through; }

    /* chain of custody flow */
    .coc { display: flex; align-items: flex-start; }
    .coc .cnode { flex: 1; text-align: center; padding: 0 6px; }
    .coc .cnode .cic { width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 21px; background: #eef1f6; color: #9aa3b2; }
    .coc .cnode.done .cic { background: var(--green-soft); color: var(--green); }
    .coc .cnode.current .cic { background: #e4ecff; color: var(--blue); box-shadow: 0 0 0 5px rgba(47,107,255,.12); }
    .coc .cnode .cnt { font-weight: 600; font-size: 13px; }
    .coc .cnode .cns { font-size: 11.5px; color: var(--muted); margin-top: 3px; word-break: break-word; }
    .coc .carrow { flex: 0 0 28px; text-align: center; color: #cbd5e6; font-size: 20px; margin-top: 13px; }

    /* immutable custody log */
    .immutable-note { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); background: #f3f6fb; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin-bottom: 14px; }
    .log-who { font-size: 11.5px; color: var(--blue); margin-top: 3px; font-weight: 500; }

    /* removed banner */
    .removed-banner { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* workflow action buttons */
    .btn.warn { background: #fff; border-color: #f0c98a; color: var(--amber); }
    .btn.danger { background: #fff; border-color: #f1b6b2; color: var(--red); }
    .btn:disabled { opacity: .45; cursor: default; }
  </style>
</head>

    function fmtDate(s){ if(!isRealDate(s)) return "—"; const [y,m,d]=s.split("-").map(Number); return `${d} ${MONTHS[m-1]}, ${y}`; }
    function val(s){ return (s===undefined||s===null||s==="") ? "—" : s; }
    function weight(s){ return (!s || s==="0" || s==="") ? "—" : Number(s).toLocaleString()+" kg"; }
    function shortLoc(s){ if(!s) return "—"; return s.split(",").map(n=>Number(n).toFixed(4)).join(", "); }
    function truncate(s,n){ return (s && s.length>n) ? s.slice(0,n)+"…" : s; }
    function permitState(m){ if(isRealDate(m.permitExpiryDate) && new Date(m.permitExpiryDate) < TODAY) return "EXPIRED"; return "ACTIVE"; }
    // Distinct, color-coded lifecycle statuses (FAMS v5)
    function lifecycleClass(m){ return {"Added":"grey","Under Collection":"amber","Collected":"blue","Delivered":"green"}[m.manifestStatus] || "grey"; }

    const TODAY_ISO = "2026-06-05";

    // Official lifecycle: Added → Under Collection → Collected → Delivered
    function steps(m){
      const collected = isRealDate(m.collectionDate) || m.manifestStatus==="Collected" || m.manifestStatus==="Delivered";
      const defs = [
        {key:"Added",            date:m.manifestCreationDate, reached:true},
        {key:"Under Collection", date:isRealDate(m.assignmentDate)?m.assignmentDate:m.manifestCreationDate, reached:true},
        {key:"Collected",        date:m.collectionDate,       reached:collected},
        {key:"Delivered",        date:m.deliveryDate,         reached:m.manifestStatus==="Delivered"}
      ];
      let lastIdx = 0; defs.forEach((s,i)=>{ if(s.reached) lastIdx=i; });
      return defs.map((s,i)=>({ ...s, cls: i<lastIdx ? "done" : (i===lastIdx ? "current" : "") }));
    }

    /* ---------- immutable chain-of-custody audit log ---------- */
    function ensureAudit(m){
      if(m.audit) return;
      m.audit = [];
      m.audit.push({ t:"Added", date:m.manifestCreationDate, who:"System", note:`Manifest issued for vehicle ${m.plateNumber || m.vehicleUniqueId}` });
      if(isRealDate(m.assignmentDate) && m.assignmentDate!==m.manifestCreationDate)
        m.audit.push({ t:"Under Collection", date:m.assignmentDate, who:"Dispatcher", note:`Assigned to vehicle ${m.plateNumber || m.vehicleUniqueId}` });
      if(isRealDate(m.collectionDate))
        m.audit.push({ t:"Collected", date:m.collectionDate, who:"Field crew", note:`${val(m.wasteType)} collected from ${truncate(m.producerName,42)}` });
      if(m.manifestStatus==="Delivered" && isRealDate(m.deliveryDate))
        m.audit.push({ t:"Delivered", date:m.deliveryDate, who:"Facility", note:`Delivered to ${m.facilityName || "licensed facility"}${(m.receivedWeight && m.receivedWeight!=="0") ? " · "+weight(m.receivedWeight) : ""}` });
    }
    function logAudit(m, t, note){ ensureAudit(m); m.audit.push({ t, date:TODAY_ISO, who:"Operator", note }); }

    // state machine — strictly sequential transitions
    function actionsFor(m){
      if(m.removed) return [{ label:"Restore", act:"restore", cls:"" }];
      if(m.manifestStatus==="Under Collection") return [{ label:"Mark Collected", act:"collect", cls:"primary" }, { label:"Remove", act:"remove", cls:"danger" }];
      if(m.manifestStatus==="Collected") return [{ label:"Mark Delivered", act:"deliver", cls:"primary" }, { label:"Un-Collect", act:"uncollect", cls:"warn" }, { label:"Remove", act:"remove", cls:"danger" }];
      if(m.manifestStatus==="Delivered") return [{ label:"Download PDF", act:"pdf", cls:"" }, { label:"Remove", act:"remove", cls:"danger" }];
      return [];
    }
    function doAction(act){
      const m = currentManifest; if(!m) return;
      if(act==="collect"){ m.manifestStatus="Collected"; if(!isRealDate(m.collectionDate)) m.collectionDate=TODAY_ISO; logAudit(m,"Collected",`${val(m.wasteType)} collected from ${truncate(m.producerName,42)}`); }
      else if(act==="deliver"){ m.manifestStatus="Delivered"; if(!isRealDate(m.deliveryDate)) m.deliveryDate=TODAY_ISO; if(!m.facilityName){ m.facilityName="Licensed Disposal Facility"; m.facilityCity="Abu Dhabi"; } logAudit(m,"Delivered",`Delivered to ${m.facilityName}`); }
      else if(act==="uncollect"){ m.manifestStatus="Under Collection"; m.collectionDate=""; logAudit(m,"Un-Collected","Collection reverted — error correction"); }
      else if(act==="remove"){ m.removed=true; logAudit(m,"Removed","Soft-deleted; audit trail preserved"); }
      else if(act==="restore"){ m.removed=false; logAudit(m,"Restored","Manifest restored"); }
      else if(act==="pdf"){ return; }
      renderList();
      openProfile(currentIndex);
    }

    /* ---------- list ---------- */
    function renderList(){
      const active = MANIFESTS.filter(m=>!m.removed);
      document.getElementById("countPill").textContent = `${active.length} active`;
      // status summary (reflects the Vehicle Manifest Activity Report counts)
      const count = s => active.filter(m=>m.manifestStatus===s).length;
      document.getElementById("statusSummary").innerHTML = [
        ["Under Collection","sc-amber"], ["Collected","sc-blue"], ["Delivered","sc-green"]
      ].map(([s,c])=>`<span class="schip"><span class="sc-dot ${c}"></span>${s} <b>${count(s)}</b></span>`).join("")
        + (MANIFESTS.some(m=>m.removed) ? `<span class="schip"><span class="sc-dot sc-grey"></span>Removed <b>${MANIFESTS.filter(m=>m.removed).length}</b></span>` : "");

      document.getElementById("manifestRows").innerHTML = MANIFESTS.map((m,i)=>{
        const st = permitState(m); const cls = st==="ACTIVE" ? "green" : "red";
        const life = m.removed ? `<span class="badge red">Removed</span>` : `<span class="badge ${lifecycleClass(m)}"><span class="dotc"></span>${m.manifestStatus}</span>`;
        return `<tr class="${m.removed?"removed":""}" onclick="openProfile(${i})">
          <td>${m.id}</td>
          <td><b>${m.manifestNumber}</b></td>
          <td>${m.wasteType}</td>
          <td>${val(m.accountNumber)}</td>
          <td>${fmtDate(m.manifestCreationDate)}</td>
          <td class="ell" title="${m.producerName}">${m.producerName}</td>
          <td>${m.estimatedWeight}</td>
          <td>${shortLoc(m.collectionLocation)}</td>
          <td>${life}</td>
          <td><span class="badge ${cls}">${st}</span></td>
        </tr>`;
      }).join("");
    }

    /* ---------- profile pane builders ---------- */
    function cocNode(state, icon, title, sub){
      return `<div class="cnode ${state}"><div class="cic">${icon}</div><div class="cnt">${title}</div><div class="cns">${sub}</div></div>`;
    }
    function chainOfCustody(m){
      const collected = isRealDate(m.collectionDate) || m.manifestStatus==="Collected" || m.manifestStatus==="Delivered";
      const delivered = m.manifestStatus==="Delivered";
      const producer = cocNode("done", "🏭", "Producer", truncate(m.producerName,30));
      const transporter = cocNode(delivered?"done":(collected?"done":"current"), "🚚", "Transporter", `${truncate(m.transporterName,26)}${m.plateNumber?" · "+m.plateNumber:""}`);
      const facility = cocNode(delivered?"done":"pending", "🏗️", "Facility", delivered ? (m.facilityName||"Licensed facility") : "Awaiting delivery");
      return `<div class="card-box" style="margin-bottom:20px;"><h3>Chain of Custody</h3>
        <div class="coc">${producer}<div class="carrow">→</div>${transporter}<div class="carrow">→</div>${facility}</div></div>`;
    }
    function overviewPane(m){
      const stepHtml = steps(m).map(x=>`
        <div class="step ${x.cls}"><div class="dot">${x.cls==="done"?"✓":""}</div>
        <div class="stitle">${x.key}</div><div class="sdate">${fmtDate(x.date)}</div></div>`).join("");
      return `<div class="stepper">${stepHtml}</div>
      ${chainOfCustody(m)}
      <div class="detail-cols">
        <div class="col col-l">
          <div class="card-box"><h3>Route</h3>
            <div class="kv"><span class="k">Collection Location</span><span class="v">${shortLoc(m.collectionLocation)}</span></div>
            <div class="kv"><span class="k">Facility</span><span class="v">${val(m.facilityName)}</span></div>
            <div class="kv"><span class="k">Facility City</span><span class="v">${val(m.facilityCity)}</span></div>
            <div class="kv"><span class="k">Delivery Date</span><span class="v">${fmtDate(m.deliveryDate)}</span></div>
          </div>
        </div>
        <div class="col col-r">
          <div class="card-box"><h3>Parties</h3>
            <div class="kv"><span class="k">Producer</span><span class="v">${val(m.producerName)}</span></div>
            <div class="kv"><span class="k">Transporter</span><span class="v">${val(m.transporterName)}</span></div>
            <div class="kv"><span class="k">Account</span><span class="v">${val(m.accountNumber)}</span></div>
          </div>
        </div>
      </div>`;
    }

    function detailsPane(m, st, stCls){
      return `
      <div class="detail-cols">
        <div class="col col-l">
          <div class="card-box"><h3>Manifest Information</h3>
            <div class="kv"><span class="k">Manifest Number</span><span class="v">${m.manifestNumber}</span></div>
            <div class="kv"><span class="k">Manifest ID</span><span class="v">${m.id}</span></div>
            <div class="kv"><span class="k">Status</span><span class="v"><span class="badge ${lifecycleClass(m)}">${m.manifestStatus}</span></span></div>
            <div class="kv"><span class="k">Waste Type</span><span class="v">${val(m.wasteType)}</span></div>
            <div class="kv"><span class="k">Account Number</span><span class="v">${val(m.accountNumber)}</span></div>
            <div class="kv"><span class="k">Creation Date</span><span class="v">${fmtDate(m.manifestCreationDate)}</span></div>
          </div>
          <div class="card-box"><h3>Producer</h3>
            <div class="kv"><span class="k">Producer Name</span><span class="v">${val(m.producerName)}</span></div>
            <div class="kv"><span class="k">Trade Licence</span><span class="v">${val(m.producerTradeLicence)}</span></div>
            <div class="kv"><span class="k">Account Number</span><span class="v">${val(m.accountNumber)}</span></div>
            <div class="kv"><span class="k">Collection Location</span><span class="v">${shortLoc(m.collectionLocation)}</span></div>
          </div>
          <div class="card-box"><h3>Permit & Weight</h3>
            <div class="kv"><span class="k">Permit Type</span><span class="v">${val(m.permitType)}</span></div>
            <div class="kv"><span class="k">Permit Status</span><span class="v"><span class="badge ${stCls}">${st}</span></span></div>
            <div class="kv"><span class="k">Permit Expiry</span><span class="v">${fmtDate(m.permitExpiryDate)}</span></div>
            <div class="kv"><span class="k">Estimated Weight</span><span class="v">${m.estimatedWeight==="0"?"0 kg":weight(m.estimatedWeight)}</span></div>
            <div class="kv"><span class="k">Received Weight</span><span class="v">${weight(m.receivedWeight)}</span></div>
          </div>
        </div>
        <div class="col col-r">
          <div class="card-box"><h3>Transporter & Vehicle</h3>
            <div class="kv"><span class="k">Transporter</span><span class="v">${val(m.transporterName)}</span></div>
            <div class="kv"><span class="k">Trade Licence</span><span class="v">${val(m.tradeLicence)}</span></div>
            <div class="kv"><span class="k">Plate Number</span><span class="v">${val(m.plateNumber)}</span></div>
            <div class="kv"><span class="k">Vehicle Unique ID</span><span class="v">${val(m.vehicleUniqueId)}</span></div>
          </div>
          <div class="card-box"><h3>Facility & Delivery</h3>
            <div class="kv"><span class="k">Facility Name</span><span class="v">${val(m.facilityName)}</span></div>
            <div class="kv"><span class="k">Facility City</span><span class="v">${val(m.facilityCity)}</span></div>
            <div class="kv"><span class="k">Received Facility</span><span class="v">${val(m.receivedFacilityName)}</span></div>
            <div class="kv"><span class="k">Delivery Date</span><span class="v">${fmtDate(m.deliveryDate)}</span></div>
          </div>
        </div>
      </div>`;
    }

    function custodyPane(m){
      ensureAudit(m);
      const s = steps(m);
      const stepHtml = s.map(x=>`
        <div class="step ${x.cls}"><div class="dot">${x.cls==="done"?"✓":""}</div>
        <div class="stitle">${x.key}</div><div class="sdate">${fmtDate(x.date)}</div></div>`).join("");
      // immutable, append-only log (latest first)
      const ev = m.audit.slice().reverse().map((e,idx)=>`
        <div class="vevent ${idx===0?"current":"done"}"><div class="vdot"></div>
        <div class="vt">${e.t}</div><div class="vd">${fmtDate(e.date)}</div>
        <div class="vmeta">${e.note}</div><div class="log-who">${e.who}</div></div>`).join("");
      return `<div class="stepper">${stepHtml}</div>
        <div class="card-box">
          <h3>Custody Log</h3>
          <div class="immutable-note">🔒 Immutable chain-of-custody record — append-only audit trail</div>
          <div class="vtimeline">${ev}</div>
        </div>`;
    }

    function journeyPane(m){
      return `<div class="card-box">
        <h3>Collection → Facility Journey</h3>
        <div id="map"></div>
        <div class="map-legend">
          <span class="lg"><span class="pin start"></span> Collection — ${truncate(m.producerName,40)} (${shortLoc(m.collectionLocation)})</span>
          <span class="lg"><span class="pin end"></span> Facility — ${m.facilityName || "not yet delivered"}${m.facilityLocation ? " ("+shortLoc(m.facilityLocation)+")" : ""}</span>
        </div>
      </div>`;
    }

    function documentsPane(m){
      const permitName = m.permitType==="LAC" ? "Local Authority Clearance" : (m.permitType ? m.permitType+" Permit" : "Waste Permit");
      const weighbridge = m.manifestStatus==="Delivered"
        ? `<div class="doc-row"><div class="doc-ic">⚖️</div><div><div class="dn">Weighbridge Receipt</div><div class="dm">${val(m.receivedFacilityName||m.facilityName)} · ${weight(m.receivedWeight)}</div></div><span class="doc-dl">Download</span></div>`
        : "";
      return `<div class="card-box"><h3>Documents</h3>
        <div class="doc-row"><div class="doc-ic">📄</div><div><div class="dn">Manifest ${m.manifestNumber}.pdf</div><div class="dm">Generated ${fmtDate(m.manifestCreationDate)}</div></div><span class="doc-dl">Download</span></div>
        <div class="doc-row"><div class="doc-ic">🛡️</div><div><div class="dn">${val(m.permitType)} — ${permitName}</div><div class="dm">${isRealDate(m.permitExpiryDate) ? "Expires "+fmtDate(m.permitExpiryDate) : "No expiry on record"}</div></div><span class="doc-dl">View</span></div>
        ${weighbridge}
      </div>`;
    }

    const TAB_ORDER = ["overview","details","custody","journey","documents"];
    const TAB_LABEL = { overview:"Overview", details:"Details", custody:"Custody Log", journey:"Journey", documents:"Documents" };

    /* ---------- open / close manifest profile ---------- */
    let currentManifest = null;
    let currentIndex = null;
    let mapInstance = null;

    function manifestSvg(){
      return `<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
        <rect x="22" y="14" width="76" height="102" rx="9" fill="#ffffff" stroke="#c7d4ea" stroke-width="2"/>
        <rect x="44" y="8" width="32" height="16" rx="5" fill="#2f6bff"/>
        <rect x="34" y="40" width="52" height="6" rx="3" fill="#dbe3f1"/>
        <rect x="34" y="54" width="52" height="6" rx="3" fill="#dbe3f1"/>
        <rect x="34" y="68" width="34" height="6" rx="3" fill="#dbe3f1"/>
        <circle cx="78" cy="92" r="20" fill="#e3f7ec"/>
        <path d="M78 80 l6 10 -12 0 z" fill="#16a34a"/>
        <path d="M70 96 l-4 9 10 0 z" fill="#16a34a"/>
        <path d="M86 96 l4 9 -10 0 z" fill="#16a34a"/>
      </svg>`;
    }

    function openProfile(i){
      const m = MANIFESTS[i];
      currentManifest = m;
      currentIndex = i;
      ensureAudit(m);
      const st = permitState(m);
      const stCls = st==="ACTIVE" ? "green":"red";
      const other = MANIFESTS[(i+1) % MANIFESTS.length];

      // state-aware workflow actions
      document.getElementById("profileActions").innerHTML =
        `<span class="edit-link">✎ Edit</span>` +
        actionsFor(m).map(a=>`<button class="btn ${a.cls}" onclick="doAction('${a.act}')">${a.label}</button>`).join("");

      const removedBanner = m.removed ? `<div class="removed-banner">🗑️ This manifest has been removed (soft delete). The chain-of-custody audit trail is preserved.</div>` : "";

      // top open-entity tabs
      document.getElementById("panelBar").innerHTML = `
        <span class="dots"><i class="r" onclick="closeProfile()" title="Close"></i><i class="y"></i></span>
        <div class="asset-tab active"><span>📋</span><span><span class="tlabel">MANIFEST</span><b>${m.manifestNumber}</b></span></div>
        <div class="asset-tab"><span>📋</span><span><span class="tlabel">MANIFEST</span><b>${other.manifestNumber}</b></span></div>`;

      // left hero
      document.getElementById("heroCol").innerHTML = `
        <div class="hero-photo"><span class="badge ${lifecycleClass(m)}">${m.manifestStatus}</span>${manifestSvg()}</div>
        <h1>#${m.manifestNumber}</h1>
        <div class="sub">Waste Manifest · ${val(m.wasteType)}</div>
        <div class="tags">
          <span class="tag g">${val(m.permitType)}</span>
          <span class="tag a" title="${m.wasteType}">${truncate(m.wasteType,16)}</span>
          <span class="tag add">+</span>
        </div>
        <div class="section-label">Manifest Details</div>
        <div class="vd-row"><span class="k">Lifecycle</span><span class="v"><span class="badge ${lifecycleClass(m)}">${m.manifestStatus}</span></span></div>
        <div class="vd-row"><span class="k">Permit</span><span class="v"><span class="badge ${stCls}">${st}</span></span></div>
        <div class="vd-row"><span class="k">Account No.</span><span class="v">${val(m.accountNumber)}</span></div>
        <div class="vd-row"><span class="k">Created</span><span class="v">${fmtDate(m.manifestCreationDate)}</span></div>
        <div class="vd-row"><span class="k">Permit Expiry</span><span class="v">${fmtDate(m.permitExpiryDate)}</span></div>
        <div class="vd-row"><span class="k">Est. Weight</span><span class="v">${m.estimatedWeight==="0"?"0 kg":weight(m.estimatedWeight)}</span></div>
        <div class="vd-row"><span class="k">Received Weight</span><span class="v">${weight(m.receivedWeight)}</span></div>
        <div class="vd-row"><span class="k">Collection</span><span class="v">${shortLoc(m.collectionLocation)}</span></div>`;

      // tabs
      document.getElementById("profileTabs").innerHTML = TAB_ORDER.map((t,idx)=>
        `<div class="tab ${idx===0?"active":""}" onclick="showPane('${t}',this)">${TAB_LABEL[t]}</div>`).join("");

      // panes
      const builders = { overview: overviewPane(m), details: detailsPane(m,st,stCls), custody: custodyPane(m), journey: journeyPane(m), documents: documentsPane(m) };
      document.getElementById("profileScroll").innerHTML = removedBanner + TAB_ORDER.map((t,idx)=>
        `<div class="pane ${idx===0?"active":""}" id="pane-${t}">${builders[t]}</div>`).join("");

      document.getElementById("listPage").classList.add("dimmed");
      document.getElementById("backdrop").classList.add("show");
      document.getElementById("panel").classList.add("show");
      document.getElementById("profileScroll").scrollTop = 0;
    }

    function closeProfile(){
      if(mapInstance){ mapInstance.remove(); mapInstance = null; }
      document.getElementById("panel").classList.remove("show");
      document.getElementById("backdrop").classList.remove("show");
      document.getElementById("listPage").classList.remove("dimmed");
    }

    function showPane(name, el){
      document.querySelectorAll("#profileTabs .tab").forEach(t=>t.classList.remove("active"));
      el.classList.add("active");
      document.querySelectorAll("#profileScroll .pane").forEach(p=>p.classList.remove("active"));
      document.getElementById("pane-"+name).classList.add("active");
      document.getElementById("profileScroll").scrollTop = 0;
      if(name==="journey") renderMap(currentManifest);
    }

    /* ---------- map ---------- */
    function parseLoc(s){ if(!s) return null; const [lat,lng]=s.split(",").map(Number); return (isFinite(lat)&&isFinite(lng))?[lat,lng]:null; }

    function renderMap(m){
      const el = document.getElementById("map");
      if(!el) return;
      const start = parseLoc(m.collectionLocation);
      const end   = parseLoc(m.facilityLocation);

      if(typeof L === "undefined" || !start){
        el.innerHTML = `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#eef2f8;border:1px dashed #cdd6e4;border-radius:12px;color:#8b94a6;text-align:center;padding:20px;">
          <div style="font-size:30px;">🗺️</div>
          <div style="font-weight:600;color:#5b6677;">Map preview needs internet connectivity</div>
          <div style="font-size:12.5px;">Collection: ${start?shortLoc(m.collectionLocation):"—"}${end?" &nbsp;→&nbsp; Facility: "+shortLoc(m.facilityLocation):""}</div>
        </div>`;
        return;
      }

      if(mapInstance){ mapInstance.remove(); mapInstance = null; }
      mapInstance = L.map("map", { zoomControl: true, scrollWheelZoom: false }).setView(start, 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap", maxZoom: 19 }).addTo(mapInstance);
      const pin = (color)=>L.divIcon({className:"", html:`<div style="position:relative;width:18px;height:24px;"><div style="position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);"></div></div>`, iconSize:[18,24], iconAnchor:[9,24], popupAnchor:[0,-22]});
      L.marker(start,{icon:pin("#2f6bff")}).addTo(mapInstance).bindPopup(`<b>Collection</b><br>${m.producerName}`);
      if(end){
        L.marker(end,{icon:pin("#16a34a")}).addTo(mapInstance).bindPopup(`<b>Facility</b><br>${m.facilityName}`);
        L.polyline([start,end],{color:"#2f6bff",weight:3,opacity:.7,dashArray:"6 8"}).addTo(mapInstance);
        mapInstance.fitBounds(L.latLngBounds([start,end]).pad(0.35));
      }
      setTimeout(()=>mapInstance.invalidateSize(),100);
    }

    document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeProfile(); });
    renderList();
  </script>
</body>
</html>
